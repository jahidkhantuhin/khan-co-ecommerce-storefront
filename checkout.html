<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183c32">
    <title>Your bag — Nova Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
    <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
  </head>
  <body>
    <div class="checkout-header">
      <div class="header-content">
        <div class="checkout-header-left-section">
          <a href="amazon.html" class="checkout-brand">
            <span class="brand-mark" aria-hidden="true">n</span>
            <span class="brand-name">nova<span>market</span></span>
          </a>
        </div>
        <div class="checkout-header-middle-section">Your bag</div>
        <div class="checkout-header-right-section">
          <span class="secure-checkout"><span aria-hidden="true">♙</span> Secure checkout</span>
        </div>
      </div>
    </div>

    <main class="main">
      <div class="checkout-heading">
        <div>
          <p class="eyebrow">Almost yours</p>
          <h1 class="page-title">Review your order</h1>
        </div>
        <a class="return-to-home-link" href="amazon.html">← Keep browsing</a>
      </div>
      <div class="checkout-grid">
        <div class="order-summary js-order-summary"></div>
        <div class="payment-summary js-payment-summary"></div>
      </div>
    </main>

    <script type="module" src="scripts/checkout.js"></script>
  </body>
</html>
