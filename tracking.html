<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183c32">
    <title>Track your delivery — Khan & Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/tracking.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span class="brand-name">Khan <span>&amp; Co.</span></span>
        </a>
      </div>

      <div class="amazon-header-middle-section">
        <form class="search-form" action="amazon.html" role="search">
          <label class="visually-hidden" for="tracking-search">Search Khan & Co.</label>
          <input class="search-bar" id="tracking-search" name="q" type="search" placeholder="Search for something lovely...">
          <button class="search-button" type="submit" aria-label="Search">
            <img class="search-icon" src="images/icons/search-icon.png" alt="">
          </button>
        </form>
      </div>

      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="orders.html">
          <span class="returns-text">Good to see you</span>
          <span class="orders-text">Your orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <span class="cart-icon" aria-hidden="true">♡</span>
          <span class="cart-quantity js-cart-quantity">0</span>
          <span class="cart-text">Bag</span>
        </a>
      </div>
    </div>

    <main class="main">
      <div class="order-tracking">
        <a class="back-to-orders-link link-primary" href="orders.html">
          View all orders
        </a>

        <p class="eyebrow tracking-eyebrow">On its way to you</p>
        <h1 class="delivery-date">
          Arriving on Monday, June 13
        </h1>

        <div class="product-info tracking-product-name">
          Black and Gray Athletic Cotton Socks - 6 Pairs
        </div>

        <div class="product-info">
          Quantity: 1
        </div>

        <div class="tracking-product-card">
          <img class="product-image" src="images/products/athletic-cotton-socks-6-pairs.jpg" alt="Black and Gray Athletic Cotton Socks - 6 Pairs">
          <div><span class="tracking-product-label">YOUR DELIVERY</span><strong>Black and Gray Athletic Cotton Socks</strong><small>Quantity: 1 · Ships with care</small></div>
        </div>

        <div class="progress-labels-container" aria-label="Delivery progress: shipped">
          <div class="progress-label">
            Preparing
          </div>
          <div class="progress-label current-status">
            Shipped
          </div>
          <div class="progress-label">
            Delivered
          </div>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar"></div>
        </div>
      </div>
    </main>
    <script type="module" src="scripts/store-header.js"></script>
  </body>
</html>
